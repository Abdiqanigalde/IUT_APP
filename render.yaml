services:
  - type: web
    name: iut-appointment
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --worker-class gthread --threads 4 -w 1 --timeout 60 app:app
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: SECRET_KEY
        generateValue: true
      - key: CRON_SECRET
        generateValue: true
      - key: FLASK_ENV
        value: production
      - key: BREVO_API_KEY
        sync: false
      - key: MAIL_USERNAME
        sync: false
